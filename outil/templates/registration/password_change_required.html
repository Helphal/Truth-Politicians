{% extends "base.html" %}
{% block title %}Mot de passe{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Changement de mot de passe obligatoire</h1>
  <p class="lede">Choisissez un mot de passe personnel d’au moins 14 caractères avant d’accéder à l’atelier.</p>
  <form method="post" autocomplete="off">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
  </form>
</section>
{% endblock %}
